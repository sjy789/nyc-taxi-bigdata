services:
  spark-master:
    image: nyc-taxi-spark-ml:3.5.8
    build:
      context: .
      dockerfile: Dockerfile.spark-ml
    container_name: taxi-spark-master
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "18080:8080"
    volumes:
      - ./apps:/opt/spark-apps:ro
      - ./data:/opt/spark-data

  spark-worker:
    image: nyc-taxi-spark-ml:3.5.8
    build:
      context: .
      dockerfile: Dockerfile.spark-ml
    container_name: taxi-spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - "2G"
      - --webui-port
      - "8081"
    ports:
      - "18081:8081"
    volumes:
      - ./data:/opt/spark-data
